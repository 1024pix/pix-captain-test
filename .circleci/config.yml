version: 2.1

workflows:
  version: 2
  test:
    jobs:
      - build_and_test

jobs:
  build_and_test:
    docker:
      - image: cimg/node:26.13.1@sha256:1530b603ed546e61bc7e7f892a32c8fd67a34cde7067bb088442e072d0728077
    working_directory: ~/pix-captain-test
    steps:
      - checkout
      - run: cat package*.json > cachekey
      - restore_cache:
          keys:
            - v1-api-npm-{{ checksum "cachekey" }}
      - run: npm ci
      - save_cache:
          key: v1-api-npm-{{ checksum "cachekey" }}
          paths:
            - ~/.npm
      - run:
          name: Run test
          command: npm run test