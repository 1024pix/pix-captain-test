version: 2.1

workflows:
  version: 2
  test:
    jobs:
      - build_and_test

jobs:
  build_and_test:
    docker:
      - image: cimg/node:26.12.1@sha256:8b451a3ecf9eb810f23612be560c17731d2766f0ad104fff9f5ae7d26d3f061a
    working_directory: ~/pix-captain-test
    steps:
      - checkout
      - run: cat package*.json > cachekey
      - restore_cache:
          keys:
            - v1-api-npm-{{ checksum "cachekey" }}
      - run: npm ci
      - save_cache:
          key: v1-api-npm-{{ checksum "cachekey" }}
          paths:
            - ~/.npm
      - run:
          name: Run test
          command: npm run test