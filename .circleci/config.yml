version: 2.1

workflows:
  version: 2
  test:
    jobs:
      - build_and_test

jobs:
  build_and_test:
    docker:
      - image: cimg/node:24.21.0@sha256:2944a8d6bea9d71395f670ee689ca63a02b34a846ad9a5d617d21eefe57a9209
    working_directory: ~/pix-captain-test
    steps:
      - checkout
      - run: cat package*.json > cachekey
      - restore_cache:
          keys:
            - v1-api-npm-{{ checksum "cachekey" }}
      - run: npm ci
      - save_cache:
          key: v1-api-npm-{{ checksum "cachekey" }}
          paths:
            - ~/.npm
      - run:
          name: Run test
          command: npm run test